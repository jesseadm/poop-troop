<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Kids Working Together -->
  <g>
    <!-- Sun -->
    <circle cx="170" cy="30" r="12" fill="#FFD700"/>

    <!-- Ground -->
    <rect x="0" y="130" width="200" height="70" fill="#8a6248" opacity="0.3"/>

    <!-- Kid 1 (left) -->
    <!-- Head -->
    <circle cx="50" cy="50" r="12" fill="#f4a460"/>
    <!-- Body -->
    <rect x="45" y="65" width="10" height="25" fill="#4169E1"/>
    <!-- Arms -->
    <line x1="40" y1="72" x2="25" y2="60" stroke="#f4a460" stroke-width="3" stroke-linecap="round"/>
    <line x1="60" y1="72" x2="75" y2="65" stroke="#f4a460" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="48" y1="90" x2="48" y2="110" stroke="#4169E1" stroke-width="3" stroke-linecap="round"/>
    <line x1="52" y1="90" x2="52" y2="110" stroke="#4169E1" stroke-width="3" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="48" cy="115" rx="4" ry="5" fill="#000000"/>
    <ellipse cx="52" cy="115" rx="4" ry="5" fill="#000000"/>

    <!-- Kid 2 (right, taller) -->
    <!-- Head -->
    <circle cx="150" cy="45" r="13" fill="#f4a460"/>
    <!-- Body -->
    <rect x="145" y="62" width="10" height="30" fill="#FF69B4"/>
    <!-- Arms -->
    <line x1="140" y1="70" x2="125" y2="58" stroke="#f4a460" stroke-width="3" stroke-linecap="round"/>
    <line x1="160" y1="70" x2="180" y2="60" stroke="#f4a460" stroke-width="3" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="148" y1="92" x2="148" y2="115" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="92" x2="152" y2="115" stroke="#FF69B4" stroke-width="3" stroke-linecap="round"/>
    <!-- Shoes -->
    <ellipse cx="148" cy="120" rx="4" ry="5" fill="#000000"/>
    <ellipse cx="152" cy="120" rx="4" ry="5" fill="#000000"/>

    <!-- Scoop/Tool -->
    <rect x="85" y="75" width="5" height="35" fill="#8b7355" stroke="#6d5a38" stroke-width="1"/>
    <path d="M 82 110 Q 87 110 92 110" fill="#a0916f" stroke="#8b7355" stroke-width="2" stroke-linecap="round"/>

    <!-- Money/Coins -->
    <circle cx="40" cy="140" r="5" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    <text x="40" y="143" font-size="6" text-anchor="middle" fill="#DAA520" font-weight="bold">$</text>

    <circle cx="160" cy="145" r="5" fill="#FFD700" stroke="#DAA520" stroke-width="1"/>
    <text x="160" y="148" font-size="6" text-anchor="middle" fill="#DAA520" font-weight="bold">$</text>

    <!-- Heart above (happy) -->
    <text x="100" y="30" font-size="24" text-anchor="middle" fill="#FF1493">♥</text>
  </g>
</svg>