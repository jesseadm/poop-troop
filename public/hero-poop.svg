<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Happy Poop Character -->
  <g>
    <!-- Main poop body -->
    <path d="M 100 40 Q 130 40 130 70 Q 130 100 100 120 Q 70 100 70 70 Q 70 40 100 40" fill="#8B6F47" stroke="#6D5A38" stroke-width="2"/>

    <!-- Lighter highlights -->
    <ellipse cx="90" cy="60" rx="15" ry="20" fill="#A0845F" opacity="0.6"/>

    <!-- Left eye -->
    <circle cx="85" cy="75" r="8" fill="#FFFFFF"/>
    <circle cx="85" cy="75" r="5" fill="#000000"/>
    <circle cx="87" cy="73" r="2" fill="#FFFFFF"/>

    <!-- Right eye -->
    <circle cx="115" cy="75" r="8" fill="#FFFFFF"/>
    <circle cx="115" cy="75" r="5" fill="#000000"/>
    <circle cx="117" cy="73" r="2" fill="#FFFFFF"/>

    <!-- Happy mouth -->
    <path d="M 90 95 Q 100 105 110 95" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Cheeks (blush) -->
    <circle cx="70" cy="85" r="8" fill="#FFB6C1" opacity="0.5"/>
    <circle cx="130" cy="85" r="8" fill="#FFB6C1" opacity="0.5"/>
  </g>
</svg>